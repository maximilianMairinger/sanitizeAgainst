name: CI

on: push

jobs:

  CI:
    name: CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Setup Node.js
      uses: actions/setup-node@master
      with:
        node-version: '16.x'
    - name: Install dependencies
      run: |
        npm i

    # The library's own suite. This one gates the build: if it goes red,
    # something regressed.
    - name: Test
      run: |
        npm run test:lib --if-present
      env:
        CI: true

    # The audit findings. Expected red until they are fixed — each failure is an
    # open finding, and the count going down is the progress bar. Deliberately
    # non-gating, so it cannot mask a regression in the suite above.
    - name: Audit findings (expected red until fixed)
      run: |
        npx jest audit
      continue-on-error: true
      env:
        CI: true
